services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-senayan}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - slims_db_data:/var/lib/mysql
    networks:
      - slims-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # Database port intentionally is not published to the host.

  db-init:
    image: ${IMAGE_NAME:?Set IMAGE_NAME in .env}:${IMAGE_TAG:-dev}
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-senayan}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    entrypoint: ["/usr/local/bin/slims-db-init.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - slims-internal
    security_opt:
      - no-new-privileges:true

  slims:
    image: ${IMAGE_NAME:?Set IMAGE_NAME in .env}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-senayan}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - slims_files:/var/www/html/files
      - slims_images:/var/www/html/images
      - slims_repository:/var/www/html/repository
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - slims-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  slims-internal:
    driver: bridge

volumes:
  # Deliberately named to avoid accidentally reusing unrelated project volumes.
  slims_db_data:
  slims_files:
  slims_images:
  slims_repository:
